name: journal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - journal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journal"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  journal_postgres_data:
