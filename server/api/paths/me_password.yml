put:
  tags: [Auth]
  operationId: changeOwnPassword
  summary: Изменить пароль текущего пользователя
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yml#/components/schemas/ChangeOwnPasswordRequest'
  responses:
    '200':
      description: Пароль изменён.
      content:
        application/json:
          schema:
            $ref: '../openapi.yml#/components/schemas/ChangeOwnPasswordResponse'
    '400':
      $ref: '../openapi.yml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yml#/components/responses/Forbidden'
