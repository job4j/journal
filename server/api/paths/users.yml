get:
  tags: [Users]
  operationId: listUsers
  summary: Получить пользователей
  description: Требуется `can_view_user` с глобальным доступом.
  x-required-permission: can_view_user
  parameters:
    - $ref: '../openapi.yml#/components/parameters/RoleQuery'
    - $ref: '../openapi.yml#/components/parameters/LimitQuery'
    - $ref: '../openapi.yml#/components/parameters/OffsetQuery'
  responses:
    '200':
      description: Список пользователей.
      content:
        application/json:
          schema:
            $ref: '../openapi.yml#/components/schemas/ListUsersResponse'
    '401':
      $ref: '../openapi.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yml#/components/responses/Forbidden'
post:
  tags: [Users]
  operationId: createUser
  summary: Создать пользователя
  description: Требуется глобальное разрешение `can_create_user`.
  x-required-permission: can_create_user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yml#/components/schemas/CreateUserRequest'
  responses:
    '201':
      description: Пользователь создан.
      content:
        application/json:
          schema:
            $ref: '../openapi.yml#/components/schemas/CreateUserResponse'
    '400':
      $ref: '../openapi.yml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yml#/components/responses/Forbidden'
    '409':
      $ref: '../openapi.yml#/components/responses/Conflict'
