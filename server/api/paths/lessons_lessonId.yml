patch:
  tags: [Lessons]
  operationId: updateLesson
  summary: Изменить урок и домашнее задание
  parameters:
    - name: lessonId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yml#/components/schemas/CreateLessonRequest' }
  responses:
    '200':
      description: Урок изменён.
      content:
        application/json:
          schema: { $ref: '../openapi.yml#/components/schemas/CreateLessonResponse' }
    '400': { $ref: '../openapi.yml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yml#/components/responses/Forbidden' }
    '404': { $ref: '../openapi.yml#/components/responses/NotFound' }
